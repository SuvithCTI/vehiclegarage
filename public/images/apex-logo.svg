<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#cbd5e1" />
      <stop offset="38%" stop-color="#64748b" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="78%" stop-color="#334155" />
      <stop offset="92%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="redGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff3838" />
      <stop offset="40%" stop-color="#e50914" />
      <stop offset="75%" stop-color="#990000" />
      <stop offset="100%" stop-color="#450000" />
    </radialGradient>

    <pattern id="carbon" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#121214" />
      <rect width="3" height="3" fill="#1e1e24" />
      <rect x="3" y="3" width="3" height="3" fill="#18181c" />
      <path d="M0 3L3 0M3 6L6 3" stroke="#2a2a32" stroke-width="0.6" />
    </pattern>

    <linearGradient id="silverCrest" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f1f5f9" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <radialGradient id="goldPeak" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffdf0" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>

    <linearGradient id="crystalGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Outer Aerodynamic Supercar Shield (Titanium & Chrome Bezel) -->
  <path
    d="M 60 8 C 85 8 110 16 110 32 C 110 75 80 102 60 112 C 40 102 10 75 10 32 C 10 16 35 8 60 8 Z"
    fill="url(#bezel)"
    stroke="#0f172a"
    stroke-width="1.2"
  />

  <!-- 2. Inner Carbon Fiber Backing -->
  <path
    d="M 60 12.5 C 82 12.5 104.5 19.5 104.5 34 C 104.5 72 77 97 60 106.5 C 43 97 15.5 72 15.5 34 C 15.5 19.5 38 12.5 60 12.5 Z"
    fill="url(#carbon)"
  />

  <!-- 3. Deep Ruby Track Enamel Center Glow -->
  <path
    d="M 60 15 C 80 15 101 21.5 101 35 C 101 70 75 93 60 102 C 45 93 19 70 19 35 C 19 21.5 40 15 60 15 Z"
    fill="url(#redGlow)"
    opacity="0.94"
  />

  <!-- 4. Precision Tachometer Arc / Calibration Tick Marks -->
  <path
    d="M 28 42 C 28 24 92 24 92 42"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.4"
    stroke-width="1.5"
    stroke-dasharray="3 4"
  />
  <path
    d="M 33 80 C 42 90 60 97 60 97 C 60 97 78 90 87 80"
    fill="none"
    stroke="#facc15"
    stroke-opacity="0.6"
    stroke-width="1.2"
  />

  <!-- 5. Iconic "Apex" Stylized Wing & Master Wrench -->
  <g filter="url(#crestShadow)">
    <path
      d="M 60 22 L 82 72 L 71 72 L 66 59 L 54 59 L 49 72 L 38 72 Z M 60 38 L 56.5 52 L 63.5 52 Z"
      fill="url(#silverCrest)"
      stroke="#ffffff"
      stroke-width="0.8"
      stroke-linejoin="round"
    />
    <path
      d="M 60 33 L 60 84 M 54 84 L 66 84 M 52 89 L 68 89"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <circle cx="60" cy="86" r="3.5" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
    <circle cx="60" cy="86" r="1.5" fill="#facc15" />
    <path d="M 26 38 C 34 46 44 54 44 54 L 41 57 C 33 49 24 40 26 38 Z" fill="#ffffff" fill-opacity="0.85" />
    <path d="M 94 38 C 86 46 76 54 76 54 L 79 57 C 87 49 96 40 94 38 Z" fill="#ffffff" fill-opacity="0.85" />
  </g>

  <!-- 6. Crystal Glass Dome Reflection Arc -->
  <path
    d="M 20 34 C 20 20 40 15 60 15 C 80 15 100 20 100 34 C 100 48 80 56 60 56 C 40 56 20 48 20 34 Z"
    fill="url(#crystalGlass)"
    pointer-events="none"
  />

  <!-- 7. 24K Gold Ignition Apex Spark at the Crown -->
  <g transform="translate(60, 14)">
    <circle cx="0" cy="0" r="8" fill="#facc15" fill-opacity="0.35" />
    <circle cx="0" cy="0" r="5" fill="#fef08a" fill-opacity="0.5" />
    <circle cx="0" cy="0" r="3.8" fill="url(#goldPeak)" stroke="#ffffff" stroke-width="0.8" />
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" />
  </g>
</svg>
